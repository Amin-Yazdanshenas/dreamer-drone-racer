# Rate caps halved from 10 to 5 rad/s. The previous 270k-step run showed the drone
# tumbling out and crashing within ~1 second of every episode (episode_length ~110 RL
# steps) despite actor/action_sat_frac being only 0.14 — a moderate action like a=0.5
# was still commanding 5 rad/s roll/pitch, which at max_thrust ≈ 24 N is enough rotation
# authority to flip the drone before it can navigate a gate. 5 rad/s is still aggressive
# enough for racing once the policy can fly stably, and matches the rate authority used
# by upstream drone-racing PPO baselines.
max_roll_rate: 5.0
max_pitch_rate: 5.0
max_yaw_rate: 2.0
max_thrust: 23.8239
hover_thrust: 5.9606
