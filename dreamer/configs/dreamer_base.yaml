# DreamerV3 / R2-Dreamer base configuration.
#
# Keys MUST match `DreamerConfig` dataclass field names — `from_yaml`/`_load_config`
# silently drop any unknown key via `hasattr(cfg, k)` check. Previous version used
# paper-style names (z_cats, mlp_dim, free_bits, beta_pred, lr_world/lr_actor/lr_critic,
# target_critic_ema, horizon for imag-rollout) which were ALL dropped → training ran
# with dataclass defaults (discrete=16, hidden=256, loss_scale_rew=1.0, lr=4e-5,
# gamma=0.933 via `horizon: 15` accidentally overriding the discount-horizon field).
# This rewrite fixes the mapping. NE-Dreamer yaml already used correct names.

obs_mode: rgb
image_channels: 3       # overridden per obs-mode yaml
state_dim: 16           # ang_vel(3) + quat(4) + lin_vel(3) + target_pos_b(3) + gate_normal_b(3)
action_dim: 4

# ----- RSSM (faithful R2-Dreamer port: h_dim=2048, hidden=768, stoch=32, discrete=32) -----
h_dim: 2048             # deter recurrent state dim
stoch: 32               # number of categorical variables
discrete: 32            # classes per categorical
hidden: 768             # MLP hidden size in RSSM + heads
blocks: 8
obs_layers: 1
img_layers: 2
dyn_layers: 1
# unimix_ratio blends each categorical's softmax probs with a uniform prior: probs ←
# (1-r)·softmax + r/K. Stops categories from sharpening too aggressively (which is
# what posterior collapse looks like in practice).
unimix_ratio: 0.01

# ----- Encoder -----
cnn_depth: 48           # base CNN channel count (paper=48)
mlp_units: 256          # encoder state-MLP units

# ----- World model loss scales -----
# Paper β_pred=3.0 → reward + continue heads weighted 3x to balance against KL/repr.
loss_scale_rew: 3.0
loss_scale_con: 3.0
# Upstream R2-Dreamer splits the KL into dyn (= KL(stop-grad post || prior), pulls prior
# toward posterior) and rep (= KL(post || stop-grad prior), pulls posterior toward prior).
# Both are clipped per-category at kl_free. beta_dyn / beta_rep are now actually wired by
# agent.py:_world_model_loss. The old loss_scale_dyn knob is dead but kept in DreamerConfig
# for back-compat with older YAML files.
beta_dyn: 0.5
beta_rep: 0.1
# kl_free: per-category free-bits floor on dyn/rep KL. Was 1.0 (DreamerV3-paper default),
# which with stoch=32 categories pinned total KL at ≥32 nats and zeroed gradient when each
# category was below 1 nat. On this task that left wm/dyn_loss and wm/rep_loss stuck at
# 32 through 713k env-steps while wm/kl_unclamped only crept up to ~13 — the WM never
# got pressure to encode state-conditional posteriors, so the reward head learned an
# unstructured map and imag/return_mean inflated to +3.3 while real episode_reward stayed
# at +2.0 (model exploitation). Lowering to 0.1 means the floor only kicks in once a
# category drops below 0.1 nats, so the WM has real gradient to learn dynamics structure.
kl_free: 0.1
loss_scale_barlow: 0.05

# ----- Informed-Dreamer privileged-state decoder (SkyDreamer arXiv 2510.14783) -----
# Decoder MLP reconstructs privileged ground-truth from latent: drone world pos/vel +
# drone pos/vel in next-gate frame (12-dim). Forces latent to encode physical state.
# Set priv_state_dim=0 to disable and revert to pure Barlow Twins.
priv_state_dim: 12
loss_scale_decoder: 1.0

# ----- Actor-critic -----
# imag_horizon dropped from the DreamerV3 default 15 to 10. The 460k-step run with stronger
# attitude shaping showed imag/return_mean inflating to +1.44 while real episodes pulled
# +3.76 -> -2.44 -> +3.76 (highly variable). return/scale tracked the imag inflation to +6.06,
# which destabilised the actor's normalised targets. Shorter horizon compounds less model error
# and keeps imag/return closer to realistic episode returns. Can be raised back to 15 once the
# WM posterior is using more capacity (currently ~2.3 nats out of 32-nat budget).
imag_horizon: 10
horizon: 333            # discount horizon → gamma = 1 - 1/333 ≈ 0.997
lam: 0.95
entropy_scale: 3.0e-3   # 10x paper: bare 3e-4 collapsed policy in earlier runs
entropy_min: 1.0        # entropy floor (nats)
entropy_floor_weight: 1.0e-2
slow_target_fraction: 0.02   # target critic EMA alpha (= 1 - 0.98)

# ----- Optimizer (LaProp + AGC; paper's grad_clip not wired — AGC used instead) -----
# NM512 r2dreamer uses single lr=4e-5; paper splits wm=1e-4, ac=3e-5. Single-lr field —
# pick wm-side 1e-4 (largest module). Bump down if actor diverges.
lr: 1.0e-4
agc: 0.3
pmin: 1.0e-3
eps: 1.0e-20
beta1: 0.9
beta2: 0.999
warmup: 1000            # LR warmup grad steps

# ----- Training -----
seq_len: 64
batch_size: 16
# warmup_steps counts ENV steps. The train loop increments step += num_envs each vectorised
# tick, so warmup_steps=2000 with 512 envs was only ~4 ticks → no real random-action data
# collection before the first WM update fired on a tiny correlated buffer. 50000 ≈ 98 ticks
# at 512 envs.
warmup_steps: 50000
update_every: 1
# n_grad_steps controls train ratio. With B=16, T=64 → 1024 sampled timesteps per grad step,
# and 512 envs adding 512 new transitions per env-step, n_grad_steps=4 gave sample/collected
# ≈ 8x. DreamerV3 paper uses 16-64x. Bumping to 8 lifts ratio to ~16x and pushes more work
# onto the GPU (sim was the wall-time bottleneck at 5% GPU util on the last 4090 run).
n_grad_steps: 8

# ----- Replay -----
replay_capacity: 2000000

# ----- Speed -----
# compile is currently a dead flag — no torch.compile(...) call wires it in agent.py.
# Leave true for forward-compatibility but understand it does nothing right now.
compile: true
amp_dtype: bfloat16     # bf16 on RTX 4090

# ----- Logging -----
log_interval: 50
save_interval: 200
